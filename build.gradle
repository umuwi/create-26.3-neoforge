// Сборка порта под NeoForge 26.3 (ветка blauncher-neoforge-26.3). Исходники общие с Fabric-веткой:
// src/main + src/client — код Create Fly, src/neoforge — вход @Mod и замена Fabric Loader API.
// Fabric API подключён только для компиляции: классы, которые его используют, на NeoForge не грузятся
// (их охраняют проверки isModLoaded, как в «ванильном режиме» Create Fly).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

repositories {
    def addGroup = { String url, String... groups ->
        exclusiveContent {
            forRepository {
                maven {
                    it.url = url
                }
            }
            filter {
                groups.each {
                    includeGroup it
                }
            }
        }
    }
    addGroup("https://maven.fabricmc.net", "net.fabricmc.fabric-api", "net.fabricmc")
    addGroup("https://maven.blamejared.com", "mezz.jei")
    addGroup("https://maven.cassian.cc", "cc.cassian.rrv")
    addGroup("https://maven.squiddev.cc", "cc.tweaked")
    addGroup("https://maven.nucleoid.xyz/releases", "eu.pb4")
    addGroup("https://api.modrinth.com/maven", "maven.modrinth")
}

version = "$project.mod_version-$project.mod_id"
group = project.maven_group

base {
    archivesName = "$project.archives_base_name-neoforge-$project.minecraft_version"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/client/java', 'src/neoforge/java']
            exclude 'com/zurrtum/create/compat/rei/**'
            exclude 'com/zurrtum/create/compat/eiv/**'
            exclude 'com/zurrtum/create/mixin/ArchitecturyMixin.java'
            exclude 'com/zurrtum/create/client/compat/rei/**'
            exclude 'com/zurrtum/create/client/compat/eiv/**'
            exclude 'com/zurrtum/create/client/mixin/CraftingViewRecipeAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/zurrtum/create/client/mixin/FluidItemSpecialRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemSlotMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewMenuMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewScreenMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ViewTypeButtonMixin.java'
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/DualVertexConsumer.java'
            exclude 'com/zurrtum/create/client/mixin/ModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelPartMixin.java'
            // Только для Fabric Renderer API (MixinPlugin включает их при fabric-renderer-api-v1),
            // а их FabricBlockStateModel конфликтует с BlockStateModelExtension NeoForge
            exclude 'com/zurrtum/create/client/mixin/CopycatPanelModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/CopycatStepModelMixin.java'
        }
        resources {
            srcDirs = ['src/main/resources', 'src/client/resources', 'src/neoforge/resources']
            exclude 'fabric.mod.json'
            exclude 'create.classtweaker'
        }
    }
}

neoForge {
    version = project.neoforge_version
    accessTransformers = files('src/neoforge/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionData = files('src/neoforge/interfaces.json')

    runs {
        // Свои папки, чтобы не смешивать с мирами Fabric-ветки в run/
        client {
            client()
            gameDirectory = project.file('run-neo/client')
            // -PquickPlay=<мир> — сразу войти в мир (для проверок без ручного ввода)
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            gameDirectory = project.file('run-neo/server')
            programArgument '--nogui'
        }
    }

    mods {
        create {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Fabric API: только компиляция (на NeoForge этих классов нет, код их не трогает)
    def fabricApi = { String module, String ver -> compileOnly "net.fabricmc.fabric-api:${module}:${ver}" }
    fabricApi("fabric-api-base", "2.0.6+fcdff87f5d")
    fabricApi("fabric-transfer-api-v1", "8.0.25+fcdff87f5d")
    fabricApi("fabric-events-interaction-v0", "5.3.9+b9b88df45d")
    fabricApi("fabric-recipe-api-v1", "10.0.11+b9b88df45d")
    fabricApi("fabric-resource-loader-v1", "3.1.0+5af7744b5d")
    fabricApi("fabric-block-api-v1", "3.1.0+0ae6f9115d")
    fabricApi("fabric-registry-sync-v0", "8.0.4+1ca9f6365d")
    fabricApi("fabric-renderer-api-v1", "17.0.17+79385d0b5d")
    fabricApi("fabric-model-loading-api-v1", "8.0.37+fcdff87f5d")
    fabricApi("fabric-api-lookup-api-v1", "2.0.24+3434d6d95d")
    fabricApi("fabric-networking-api-v1", "6.4.0+a21c9eb65d")
    fabricApi("fabric-entity-events-v1", "6.0.4+3434d6d95d")
    fabricApi("fabric-lifecycle-events-v1", "4.1.9+ffef5f675d")

    compileOnly "mezz.jei:jei-${project.jei_version}"
    compileOnly "cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.cct_version}"
    compileOnly "eu.pb4:trinkets:${project.trinkets_version}"
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version
    }

    exclude "_data"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}
